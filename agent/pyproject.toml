[project]
name = "threatpulse-agent-tools"
version = "0.1.0"
description = "Python tools for the ThreatPulse agent track"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "pywin32>=311 ; sys_platform == 'win32'",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["fim", "tools"]
