[project]
name = "threatpulse"
version = "0.1.0"
description = "ThreatPulse Python pipeline: detection, triage, backend and contract checks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.162.0",
    "jsonschema>=4.26.0",
    "pefile==2024.8.26",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
    "xgboost-cpu==3.4.1",
    "yara-python==4.5.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "attack_data: needs the real ATT&CK data and model (uv run python -m backend.rag.fetch, then backend.rag.index)",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest>=9.2.0",
]
